<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mehdi — Crêpes &amp; Drinks</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app">

    <!-- ============ Hero (half viewport) ============ -->
    <header class="hero">
      <img class="hero-img" id="heroImg" alt="" />
      <div class="hero-scrim"></div>
      <div class="hero-content">
        <span class="hero-kicker">Fait minute · Marrakech</span>
        <h1 class="hero-title">Mehdi<br>Crêpes &amp; Drinks</h1>
        <p class="hero-sub">Café de spécialité, crêpes garnies et boissons fraîches, préparés à la minute.</p>
      </div>

      <button class="cart-badge" id="cartBadge" aria-label="Voir la commande">
        <span class="cart-badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20.5L6 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        </span>
        <span class="cart-badge-count" id="cartCount">0</span>
      </button>
    </header>

    <!-- ============ Filters ============ -->
    <nav class="filter-row filter-row--main" id="groupBar" aria-label="Catégorie"></nav>
    <nav class="filter-row filter-row--sub" id="subBar" aria-label="Sous-catégorie"></nav>

    <!-- ============ Product list ============ -->
    <main class="menu-section" id="menuSection"></main>

    <footer class="site-footer">Prix en dirhams (dh)</footer>
  </div>

  <!-- ============ Product sheet ============ -->
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-scroll">
      <div class="sheet-hero">
        <div class="sheet-hero-icon" id="sheetImg"></div>
        <button class="sheet-close" id="sheetClose" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="sheet-body">
        <span class="sheet-eyebrow" id="sheetEyebrow"></span>
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <p class="sheet-desc" id="sheetDesc"></p>

        <div class="sheet-extras" id="sheetExtras">
          <h3 class="sheet-extras-title">Extras</h3>
          <div class="extra-list" id="sheetExtrasList"></div>
        </div>

        <div class="qty-row">
          <span class="qty-label">Quantité</span>
          <div class="qty-stepper">
            <button class="qty-btn" id="qtyMinus" aria-label="Diminuer">−</button>
            <span class="qty-value" id="qtyValue">1</span>
            <button class="qty-btn" id="qtyPlus" aria-label="Augmenter">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sheet-footer">
      <button class="sheet-cta" id="sheetAddBtn">
        <span>Ajouter à la commande</span>
        <span class="sheet-cta-price" id="sheetAddPrice">0 dh</span>
      </button>
    </div>
  </div>

  <!-- ============ Cart sheet ============ -->
  <div class="overlay" id="cartOverlay"></div>
  <div class="sheet sheet--cart" id="cartSheet" role="dialog" aria-modal="true">
    <div class="sheet-handle-row">
      <h2 class="cart-title">Votre commande</h2>
      <button class="sheet-close sheet-close--static" id="cartCloseBtn" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="sheet-scroll">
      <p class="cart-empty" id="cartEmpty">Votre commande est vide pour le moment.</p>
      <div class="cart-list" id="cartList"></div>
    </div>

    <div class="sheet-footer sheet-footer--cart">
      <button class="cart-clear" id="cartClearBtn">Vider</button>
      <div class="cart-total">
        <span>Total</span>
        <strong id="cartGrandTotal">0 dh</strong>
      </div>
    </div>
  </div>

  <!-- ============ Toast ============ -->
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
